<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
  </defs>

  <!-- card background, so the picture reads the same in light and dark mode -->
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff"/>

  <!-- the computer boundary -->
  <rect x="20" y="20" width="920" height="400" rx="12" fill="#f5f7fb" stroke="#9fb3d9" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="50" font-size="15" font-weight="600" fill="#3b4a66">Your computer</text>

  <!-- Thunderbird -->
  <rect x="45" y="80" width="250" height="150" rx="10" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <text x="65" y="112" font-size="18" font-weight="700" fill="#1d1d1f">Thunderbird</text>
  <rect x="65" y="128" width="210" height="80" rx="8" fill="#e8effc"/>
  <text x="80" y="155" font-size="15" font-weight="600" fill="#1d1d1f">Mail Chat add-on</text>
  <text x="80" y="176" font-size="13" fill="#4a4a55">chat in its own tab</text>
  <text x="80" y="195" font-size="13" fill="#4a4a55">click #id → opens the mail</text>

  <!-- mailchat server -->
  <rect x="375" y="80" width="250" height="150" rx="10" fill="#3b6fd6"/>
  <text x="395" y="112" font-size="18" font-weight="700" fill="#ffffff">mailchat server</text>
  <text x="395" y="136" font-size="13" fill="#dbe6ff">Python · 127.0.0.1:8095</text>
  <text x="395" y="165" font-size="13" fill="#ffffff">• keeps the index up to date</text>
  <text x="395" y="186" font-size="13" fill="#ffffff">• runs the search tools</text>
  <text x="395" y="207" font-size="13" fill="#ffffff">• checks cited mails</text>

  <!-- LLM -->
  <rect x="705" y="80" width="210" height="150" rx="10" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <text x="725" y="112" font-size="18" font-weight="700" fill="#1d1d1f">Local LLM</text>
  <text x="725" y="136" font-size="13" fill="#4a4a55">Ollama · gemma4:12b</text>
  <text x="725" y="165" font-size="13" fill="#4a4a55">decides what to search,</text>
  <text x="725" y="186" font-size="13" fill="#4a4a55">reads mails, writes</text>
  <text x="725" y="207" font-size="13" fill="#4a4a55">the answer</text>

  <!-- add-on <-> server -->
  <line x1="297" y1="140" x2="373" y2="140" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="373" y1="170" x2="297" y2="170" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="335" y="132" font-size="12" fill="#3b4a66" text-anchor="middle">question</text>
  <text x="335" y="190" font-size="12" fill="#3b4a66" text-anchor="middle">answer</text>

  <!-- server <-> LLM -->
  <line x1="627" y1="140" x2="703" y2="140" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="703" y1="170" x2="627" y2="170" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="665" y="132" font-size="12" fill="#3b4a66" text-anchor="middle">results</text>
  <text x="665" y="190" font-size="12" fill="#3b4a66" text-anchor="middle">tool calls</text>

  <!-- tool loop note under the LLM -->
  <text x="810" y="262" font-size="12.5" fill="#3b4a66" text-anchor="middle">search_mails · read_mail</text>
  <text x="810" y="280" font-size="12.5" fill="#3b4a66" text-anchor="middle">repeated until it has</text>
  <text x="810" y="298" font-size="12.5" fill="#3b4a66" text-anchor="middle">found and read the mails</text>

  <!-- mail files -->
  <rect x="61" y="296" width="200" height="90" rx="6" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <rect x="53" y="304" width="200" height="90" rx="6" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <rect x="45" y="312" width="200" height="90" rx="6" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <text x="62" y="343" font-size="15" font-weight="600" fill="#1d1d1f">Mail files</text>
  <text x="62" y="364" font-size="13" fill="#4a4a55">Thunderbird profile</text>
  <text x="62" y="383" font-size="13" fill="#4a4a55">(all accounts, mbox)</text>

  <!-- index cylinder -->
  <path d="M410,318 v62 a90,16 0 0 0 180,0 v-62" fill="#ffffff" stroke="#c9d3e6" stroke-width="1.5"/>
  <ellipse cx="500" cy="318" rx="90" ry="16" fill="#e8effc" stroke="#c9d3e6" stroke-width="1.5"/>
  <text x="500" y="360" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Full-text index</text>
  <text x="500" y="380" font-size="13" fill="#4a4a55" text-anchor="middle">SQLite FTS5</text>

  <!-- files -> index (read-only) -->
  <line x1="247" y1="357" x2="406" y2="357" stroke="#8a8a96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="327" y="349" font-size="12" fill="#5a5a66" text-anchor="middle">read-only,</text>
  <text x="327" y="376" font-size="12" fill="#5a5a66" text-anchor="middle">every 10 min</text>

  <!-- index <-> server -->
  <line x1="500" y1="300" x2="500" y2="234" stroke="#3b6fd6" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="510" y="272" font-size="12" fill="#3b4a66">search</text>

  <!-- footer -->
  <text x="480" y="450" font-size="14" fill="#3b4a66" text-anchor="middle">No mail leaves your computer: no cloud, no account, nothing is sent or changed.</text>
</svg>
